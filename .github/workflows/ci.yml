name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: quickai
          POSTGRES_PASSWORD: quickai
          POSTGRES_DB: quickai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quickai -d quickai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://quickai:quickai@localhost:5432/quickai
      TEST_DATABASE_URL: postgresql+asyncpg://quickai:quickai@localhost:5432/quickai_test
      # Database tests must run in CI, never silently skip.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check models match migrations
        run: uv run alembic check
      - name: Test
        run: uv run pytest -q -rs

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        # --wait returns once every service's healthcheck passes.
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check API health
        run: curl --fail --silent http://localhost:8000/health
      - name: Check API can reach the database
        run: curl --fail --silent http://localhost:8000/health/ready
      - name: Check migrations ran (tables and pgvector exist)
        run: |
          docker compose exec -T db psql -U quickai -d quickai -tA \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('creations','creation_likes','user_usage');" \
            | grep -qx 3
          docker compose exec -T db psql -U quickai -d quickai -tA \
            -c "SELECT 1 FROM pg_extension WHERE extname = 'vector';" | grep -qx 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down --volumes

  server:
    name: Server (Node, being replaced)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    name: Client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Lint is added in Phase 0 PR 9, after the TypeScript migration
      # fixes the existing unused-import errors.
      - run: npm run build
